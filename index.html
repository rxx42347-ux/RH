<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><title>رِيُو Ai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand">رِيُو <span>Ai</span></div>
  <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
  <div class="chat-list" id="chatList"></div>
  <div class="side-bottom"><button>⚙ الإعدادات</button><button>ⓘ حول رِيُو</button></div>
</aside>
<div class="backdrop" id="backdrop"></div>
<main class="app">
<header class="topbar"><button id="menuBtn">☰</button><div class="top-brand">رِيُو <span>Ai</span></div><button id="newChatTop">＋</button></header>
<section class="conversation" id="conversation">
  <div class="welcome" id="welcome">
    <div class="logo-mark">رِيُو <span>Ai</span></div>
    <h1>كيف يمكنني مساعدتك؟</h1>
    <p>اكتب ما تريد إلى رِيُو.</p>
    <div class="suggestions">
      <button data-prompt="اشرح لي هذا الموضوع بطريقة بسيطة">اشرح لي موضوعًا</button>
      <button data-prompt="حلل لي صورة عندما أرفعها">حلل صورة</button>
      <button data-prompt="لخص لي ملفًا عندما أرفعه">لخص ملفًا</button>
      <button data-prompt="ساعدني في الكتابة">ساعدني في الكتابة</button>
    </div>
  </div>
</section>
<section class="composer-wrap">
  <div class="attachment-menu" id="attachmentMenu">
    <button data-tool="file">📎 ملف</button><button data-tool="image">🖼️ صورة</button>
    <button data-tool="camera">📷 كاميرا</button><button data-tool="voice">🎙️ صوت</button>
  </div>
  <div class="composer">
    <button class="round" id="attachBtn">＋</button>
    <textarea id="input" rows="1" placeholder="اكتب رسالتك إلى رِيُو..."></textarea>
    <button class="round" id="voiceBtn">🎙</button><button class="send" id="sendBtn">↑</button>
  </div>
  <div class="note">رِيُو Ai قد يخطئ أحيانًا، فتحقق من المعلومات المهمة.</div>
</section>
</main>
<input type="file" id="fileInput" hidden multiple>
<script src="app.js"></script>
</body></html>
