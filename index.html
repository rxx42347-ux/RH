<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Trust Network</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f1fb;font-family:system-ui,Tahoma,Arial}.wrap{max-width:850px;margin:auto;padding:22px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:25px;font-weight:900}.logo i{color:#43d9a3;font-style:normal}.badge{background:#0b2923;color:#6ff0bd;border:1px solid #1e6d58;border-radius:20px;padding:7px 12px;font-size:12px}.hero{padding:20px 0}.hero h1{font-size:36px;margin:0 0 10px}.hero p{color:#9db1c4;line-height:1.9}.box{background:#0c1a2a;border:1px solid #1b344b;border-radius:22px;padding:18px}.input{display:flex;gap:9px}.input input{flex:1;background:#071421;border:1px solid #29445b;color:#fff;border-radius:13px;padding:14px;font-size:15px;direction:ltr}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:900;background:#36c995;color:#062117}.result{display:none;margin-top:15px}.result.show{display:block}.risk{display:flex;gap:18px;align-items:center;background:#0a1826;border:1px solid #20394f;border-radius:16px;padding:15px}.circle{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;border:7px solid #236c57;color:#55e4ae}.red{color:#ff6f7c;border-color:#74313b}.title{font-size:21px;font-weight:900}.muted{color:#8298ad;font-size:13px;line-height:1.7}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #193047}.danger{color:#ff6f7c}.ok{color:#55e4ae}.error{color:#ff6f7c;background:#28131a;border:1px solid #61303a;padding:12px;border-radius:13px;margin-top:12px}.small{margin-top:12px;color:#70869b;font-size:11px;line-height:1.7}@media(max-width:650px){.input{flex-direction:column}.hero h1{font-size:29px}}</style><body><div class="wrap"><div class="nav"><div class="logo">DIGITAL TRUST <i>●</i></div><div class="badge">● LIVE ENGINE</div></div><section class="hero"><h1>هل يمكن الوثوق بهذا الرابط؟</h1><p>فحص دفاعي حقيقي يعتمد على مصادر تهديد، ويشرح نتيجة الفحص بدل حكم غامض.</p></section><section class="box"><div class="input"><input id="url" placeholder="https://example.com"><button class="btn" id="scan">🔍 فحص الرابط</button></div><div id="error"></div><div class="result" id="result"></div><div class="small">عدم وجود مطابقة لا يعني أن الرابط آمن 100%.</div></section></div><script>const u=document.getElementById('url'),b=document.getElementById('scan'),r=document.getElementById('result'),e=document.getElementById('error');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}b.onclick=async()=>{e.innerHTML='';r.className='result';let x=u.value.trim();if(!x){e.innerHTML='<div class="error">أدخل رابطًا.</div>';return}if(!/^https?:\/\//i.test(x))x='https://'+x;b.disabled=true;b.textContent='جاري الفحص…';try{let q=await fetch('/api/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:x})});let d=await q.json();if(!q.ok)throw Error(d.error||'فشل الفحص');let bad=d.threats?.length>0;r.innerHTML='<div class="risk"><div class="circle '+(bad?'red':'')+'">'+(bad?'⚠':'✓')+'</div><div><div class="title">'+(bad?'خطر معروف':'لم توجد مطابقة معروفة')+'</div><div class="muted">'+esc(d.explanation)+'</div></div></div><div style="margin-top:10px"><div class="row"><span class="muted">الرابط</span><b>'+esc(d.url)+'</b></div><div class="row"><span class="muted">Web Risk</span><b class="'+(bad?'danger':'ok')+'">'+(bad?d.threats.join('، '):'لا توجد مطابقة')+'</b></div></div>';r.className='result show'}catch(z){e.innerHTML='<div class="error">❌ '+esc(z.message)+'<br><span class="muted">انشر الـAPI الخلفي أولًا.</span></div>'}b.disabled=false;b.textContent='🔍 فحص الرابط'};u.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()})</script></body></html>
