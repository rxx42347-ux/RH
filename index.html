<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Empire Builder V6.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16251d;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:18px;line-height:1.05;text-shadow:0 2px 3px #000;background:#17352bce;border:1px solid #668c74;border-radius:14px;padding:8px 10px;box-shadow:0 4px 12px #0007}
.logo small{display:block;font-size:10px;color:#c9e6ce}
.resources{display:flex;gap:6px;flex:1;justify-content:center}
.res{min-width:72px;padding:7px 9px;text-align:center;border-radius:12px;background:#16352fcf;border:1px solid #6f9379;box-shadow:0 4px 12px #0007;font-weight:800;font-size:12px}
.res b{display:block;font-size:15px;color:#ffe7a0}
.res span{font-size:17px}
.side{position:absolute;left:10px;top:105px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tool{width:48px;height:48px;border:0;border-radius:14px;background:linear-gradient(#efaa3c,#a85b16);color:#fff;font-size:23px;font-weight:900;box-shadow:0 4px 0 #66340d,0 6px 12px #0007}
.tool:active,.action:active{transform:translateY(2px);box-shadow:0 2px 0 #66340d}
.bottom{position:absolute;left:8px;right:8px;bottom:max(9px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;pointer-events:auto}
.action{flex:1;max-width:120px;min-height:54px;border:0;border-radius:16px;background:linear-gradient(#efb247,#b96618);color:#fff;font-weight:900;font-size:13px;box-shadow:0 4px 0 #71390e,0 7px 14px #0007;text-shadow:0 1px 2px #5d2b08}
.panel{position:absolute;right:10px;top:86px;width:min(300px,82vw);background:#11271fe8;border:1px solid #72907a;border-radius:18px;padding:13px;box-shadow:0 10px 30px #0009;pointer-events:auto;display:none;backdrop-filter:blur(8px)}
.panel.show{display:block}
.panel h3{margin:0 0 8px;font-size:18px}
.panel p{margin:6px 0;color:#d9eadc;font-size:13px}
.panel .row{display:flex;gap:7px;margin-top:9px}
.panel button{flex:1;border:0;border-radius:11px;padding:10px;background:#d88b2c;color:#fff;font-weight:900}
.badge{display:inline-block;background:#24563c;padding:3px 7px;border-radius:9px;font-size:11px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#10261ed9;border:1px solid #70907a;border-radius:14px;padding:9px 14px;font-size:12px;max-width:90vw;text-align:center;opacity:0;transition:.2s}
.toast.show{opacity:1}
.help{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:11px;background:#10261ebd;padding:7px 11px;border-radius:12px;color:#d9eadc}
.buildbar{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:none;gap:6px;background:#10261ee8;padding:7px;border-radius:15px;border:1px solid #67836d;pointer-events:auto;white-space:nowrap}
.buildbar.show{display:flex}
.buildbar button{border:0;border-radius:10px;background:#dc9130;color:#fff;font-weight:900;padding:8px 10px}
#rotate{position:absolute;inset:0;background:#0e1a15e8;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div class="ui">
  <div class="top">
    <div class="logo">Empire Builder<small>V6.0 • 3D Kingdom</small></div>
    <div class="resources">
      <div class="res"><span>🪵</span><b id="wood">3200</b></div>
      <div class="res"><span>🪨</span><b id="stone">1700</b></div>
      <div class="res"><span>🪙</span><b id="gold">1200</b></div>
      <div class="res"><span>💎</span><b id="gems">120</b></div>
    </div>
  </div>
  <div class="help">اسحب الشاشة لتحريك الكاميرا • إصبعان للتكبير • اضغط على مبنى للتفاعل</div>
  <div class="side">
    <button class="tool" id="zoomIn">＋</button>
    <button class="tool" id="zoomOut">−</button>
    <button class="tool" id="home">⌂</button>
  </div>
  <div class="panel" id="panel">
    <h3 id="ptitle">المبنى</h3>
    <p id="pdesc"></p>
    <p><span class="badge" id="plevel">المستوى 1</span> <span class="badge" id="pstatus">جاهز</span></p>
    <div class="row"><button id="upgrade">ترقية</button><button id="close">إغلاق</button></div>
  </div>
  <div class="buildbar" id="buildbar">
    <button data-type="house">🏠 منزل</button>
    <button data-type="farm">🌾 مزرعة</button>
    <button data-type="lumber">🪵 منشرة</button>
    <button data-type="mine">⛏️ منجم</button>
    <button data-type="tower">🏹 برج</button>
  </div>
  <div class="bottom">
    <button class="action" id="world">🌍 العالم</button>
    <button class="action" id="army">⚔️ الجيش</button>
    <button class="action" id="build">🏗️ بناء</button>
    <button class="action" id="shop">🛒 المتجر</button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div id="rotate">📱<br><br>لأفضل تجربة، استخدم الوضع العمودي.</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const app=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86b86a);
scene.fog=new THREE.Fog(0x86b86a,55,120);

const camera=new THREE.OrthographicCamera(-18,18,24,-24,0.1,200);
camera.position.set(24,28,24);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableRotate=false;
controls.enablePan=true;
controls.enableZoom=true;
controls.screenSpacePanning=true;
controls.minZoom=0.75; controls.maxZoom=2.1;
controls.panSpeed=1.1; controls.zoomSpeed=0.8;
controls.target.set(0,0,0);
controls.maxPolarAngle=Math.PI/2.35;
controls.minPolarAngle=Math.PI/2.35;

scene.add(new THREE.HemisphereLight(0xdff4ff,0x35522b,2.2));
const sun=new THREE.DirectionalLight(0xfff0cf,3.0);
sun.position.set(18,35,12); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x5d9846,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const city=new THREE.Group(); scene.add(city);
const grid=new THREE.GridHelper(40,20,0x527d4e,0x6f9c63); grid.position.y=.02; grid.material.opacity=.24;grid.material.transparent=true;city.add(grid);

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.02})}
const M={stone:mat(0x777d75),wall:mat(0x9b9d91),roof:mat(0x9b3e2e),wood:mat(0x6d3f26),gold:mat(0xc39b3e),blue:mat(0x275d74),dark:mat(0x2d3534),green:mat(0x467f3e),white:mat(0xe8dfc3),red:mat(0x9f342e)};

const buildings=[];
let selected=null, buildMode=false, ghost=null;
const resources={wood:3200,stone:1700,gold:1200,gems:120};
const costs={house:{wood:180,stone:80},farm:{wood:140,stone:50},lumber:{wood:240,stone:110},mine:{wood:280,stone:180},tower:{wood:300,stone:260}};
const names={town:'قلعة العاصمة',house:'منزل',farm:'مزرعة',lumber:'منشرة الأخشاب',mine:'منجم الحجر',tower:'برج الحراسة',wall:'سور المملكة'};
let nextId=1;

function labelSprite(text){
 const c=document.createElement('canvas');c.width=256;c.height=64;
 const x=c.getContext('2d');x.fillStyle='rgba(12,30,24,.82)';x.roundRect(8,8,240,48,14);x.fill();
 x.fillStyle='#fff';x.font='bold 25px Arial';x.textAlign='center';x.fillText(text,128,40);
 const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
 s.scale.set(3.2,.8,1);return s;
}
function addRoof(group,w,d,y,c){
 const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,1.7,4),c||M.roof);
 roof.rotation.y=Math.PI/4;roof.position.y=y;roof.castShadow=true;group.add(roof);
}
function makeBuilding(type,x,z,level=1){
 const g=new THREE.Group();g.userData={type,level,id:nextId++,busy:0};
 const h=type==='town'?5.6:type==='tower'?4.0:type==='house'?2.7:2.4;
 const w=type==='town'?5.2:type==='tower'?2.7:type==='house'?2.7:3.3;
 const d=type==='town'?4.6:type==='tower'?2.7:type==='house'?2.7:3.0;
 const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),type==='town'?M.wood:type==='tower'?M.stone:(type==='farm'?M.green:M.wood));
 body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
 if(type==='town'){addRoof(g,w,d,h+.7,M.red); const crown=new THREE.Mesh(new THREE.BoxGeometry(1.3,.9,1.3),M.gold);crown.position.y=h+1.8;crown.castShadow=true;g.add(crown)}
 else if(type==='tower'){addRoof(g,w,d,h+.45,M.blue)}
 else if(type==='house'){addRoof(g,w,d,h+.35,M.roof)}
 else if(type==='farm'){
   for(let i=-1;i<=1;i++){const row=new THREE.Mesh(new THREE.BoxGeometry(.35,.5,2.2),M.gold);row.position.set(i*.75,.35,0);g.add(row)}
 }
 else {const roof=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(w,d)*.55,Math.max(w,d)*.55,.55,8),type==='mine'?M.stone:M.blue);roof.position.y=h+.3;g.add(roof)}
 const door=new THREE.Mesh(new THREE.BoxGeometry(.42,1,.08),M.dark);door.position.set(0,.5,d/2+.05);g.add(door);
 const sign=labelSprite(names[type]);sign.position.y=h+1.8;g.add(sign);
 g.position.set(x,0,z);city.add(g);buildings.push(g);
 return g;
}

function makeWall(x,z,rot=0){
 const g=new THREE.Group();g.userData={type:'wall',level:1,id:nextId++};
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.05,1.5,.42),M.wall);b.position.y=.75;b.castShadow=true;b.receiveShadow=true;g.add(b);
 for(let i=-.7;i<=.7;i+=.7){const c=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.52),M.stone);c.position.set(i,1.62,0);g.add(c)}
 g.rotation.y=rot;g.position.set(x,0,z);city.add(g);buildings.push(g);return g;
}

// Initial kingdom layout
makeBuilding('town',0,0,2);
makeBuilding('house',-5,-3); makeBuilding('house',5,-3); makeBuilding('house',-5,4); makeBuilding('house',5,4);
makeBuilding('farm',-5,9); makeBuilding('lumber',5,9); makeBuilding('mine',-5,-9); makeBuilding('tower',5,-9);
for(let x=-8;x<=8;x+=2) { makeWall(x,-12,0); makeWall(x,12,0); }
for(let z=-10;z<=10;z+=2) { makeWall(-10,z,Math.PI/2); makeWall(10,z,Math.PI/2); }

// Natural environment outside
function tree(x,z,s=1){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,1.6,7),M.wood);trunk.position.y=.8;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.DodecahedronGeometry(1.05*s,1),M.green);crown.position.y=2.0*s; crown.scale.y=1.2;crown.castShadow=true;g.add(crown);
 g.position.set(x,0,z);scene.add(g);
}
function rock(x,z,s=1){
 const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.75*s,1),M.stone);r.position.set(x,.45*s,z);r.scale.y=.7;r.castShadow=true;scene.add(r);
}
for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*24;tree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random()*.5)}
for(let i=0;i<15;i++){const a=Math.random()*Math.PI*2,r=16+Math.random()*26;rock(Math.cos(a)*r,Math.sin(a)*r,.6+Math.random()*.7)}

const water=new THREE.Mesh(new THREE.PlaneGeometry(18,10),new THREE.MeshStandardMaterial({color:0x2d8fab,roughness:.25,metalness:.1,transparent:true,opacity:.9}));
water.rotation.x=-Math.PI/2;water.position.set(-23,.02,18);scene.add(water);

// Villagers
const villagers=[];
function villager(x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.65,4,8),M.blue);body.position.y=.6;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),M.white);head.position.y=1.15;head.castShadow=true;g.add(head);
 g.position.set(x,0,z);g.userData={t:Math.random()*10,speed:.3+Math.random()*.25,origin:new THREE.Vector3(x,0,z)};
 city.add(g);villagers.push(g);
}
for(let i=0;i<9;i++)villager((Math.random()-.5)*14,(Math.random()-.5)*14);

function updateRes(){
 for(const k of ['wood','stone','gold','gems']) document.getElementById(k).textContent=Math.floor(resources[k]).toLocaleString('ar-SA');
}
updateRes();

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function openPanel(b){
 selected=b;const d=b.userData;document.getElementById('panel').classList.add('show');
 document.getElementById('ptitle').textContent=names[d.type]||'مبنى';
 document.getElementById('pdesc').textContent=d.type==='town'?'مركز مملكتك. ارفع مستواه لفتح مبانٍ ووحدات جديدة.':`هذا المبنى يساهم في تطوير مملكتك.`;
 document.getElementById('plevel').textContent='المستوى '+d.level;
 document.getElementById('pstatus').textContent=d.busy>0?'قيد التطوير':'جاهز';
}
document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('show');

document.getElementById('upgrade').onclick=()=>{
 if(!selected)return;
 const cost=selected.userData.level*140;
 if(resources.gold<cost){toast('تحتاج '+cost+' 🪙 للترقية');return}
 resources.gold-=cost;selected.userData.busy=6;selected.userData.level++;
 toast('بدأ تطوير '+names[selected.userData.type]+' ⏳');
 updateRes();openPanel(selected);
};

document.getElementById('build').onclick=()=>{
 buildMode=!buildMode;document.getElementById('buildbar').classList.toggle('show',buildMode);
 toast(buildMode?'اختر مبنى ثم اضغط على الأرض لوضعه':'تم إغلاق وضع البناء');
};
document.querySelectorAll('#buildbar button').forEach(b=>b.onclick=()=>{
 const type=b.dataset.type; if(!ghost) ghost=makeBuilding(type,0,0); ghost.traverse(o=>{if(o.isMesh)o.material=o.material.clone(),o.material.transparent=true,o.material.opacity=.42}); ghost.userData.ghost=true;
 toast('اضغط على مكان مناسب في الأرض');
});

function moveGhost(pt){
 if(!ghost)return;ghost.position.x=Math.round(pt.x/2)*2;ghost.position.z=Math.round(pt.z/2)*2;
}
function pointerWorld(e){
 const rect=renderer.domElement.getBoundingClientRect();
 const x=((e.clientX-rect.left)/rect.width)*2-1,y=-((e.clientY-rect.top)/rect.height)*2+1;
 const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x,y),camera);
 const hit=ray.intersectObject(ground)[0];return hit?hit.point:null;
}
renderer.domElement.addEventListener('pointermove',e=>{if(buildMode&&ghost)moveGhost(pointerWorld(e)||new THREE.Vector3())});
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'&&e.isPrimary===false)return;
 if(buildMode&&ghost){
   const p=pointerWorld(e); if(!p)return;
   const type=ghost.userData.type,c=costs[type];
   if(resources.wood<c.wood||resources.stone<c.stone){toast('الموارد غير كافية');return}
   resources.wood-=c.wood;resources.stone-=c.stone;
   const gx=ghost.position.x,gz=ghost.position.z;
   city.remove(ghost);buildings.splice(buildings.indexOf(ghost),1);
   ghost=null;
   const b=makeBuilding(type,gx,gz);b.userData.busy=5;
   toast('تم وضع المبنى وبدأ البناء 🏗️');
   updateRes();return;
 }
 const rect=renderer.domElement.getBoundingClientRect();
 const mouse=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
 const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(buildings.flatMap(g=>g.children),true);
 if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==city)o=o.parent;if(o.userData?.type)openPanel(o)}
});

document.getElementById('zoomIn').onclick=()=>camera.zoom=Math.min(2.1,camera.zoom+.2);
document.getElementById('zoomOut').onclick=()=>camera.zoom=Math.max(.75,camera.zoom-.2);
document.getElementById('home').onclick=()=>{camera.zoom=1.05;controls.target.set(0,0,0);camera.position.set(24,28,24);camera.lookAt(0,0,0);toast('تمت إعادة الكاميرا')};

document.getElementById('shop').onclick=()=>toast('المتجر قادم: أشكال، موارد، وتسريع البناء');
document.getElementById('army').onclick=()=>toast('الجيش قادم: تدريب وحدات وفتح معارك');
document.getElementById('world').onclick=()=>toast('العالم قادم: مدن وممالك وأراضٍ قابلة للتوسع');

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 for(const b of buildings){if(b.userData.busy>0){b.userData.busy-=dt;if(b.userData.busy<=0){b.userData.busy=0;toast(names[b.userData.type]+' اكتمل تطويره ✅')}}}
 for(const v of villagers){
   v.userData.t+=dt*v.userData.speed;
   const o=v.userData.origin;
   v.position.x=o.x+Math.sin(v.userData.t)*2.3;
   v.position.z=o.z+Math.cos(v.userData.t*.8)*1.7;
   v.rotation.y=Math.sin(v.userData.t)*.7;
 }
 // production
 resources.wood+=dt*1.15; resources.stone+=dt*.65; resources.gold+=dt*.35;
 updateRes();
 if(ghost){ghost.rotation.y=Math.sin(now*.001)*.02}
 renderer.render(scene,camera);
}
animate(performance.now());

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);
 const a=innerWidth/innerHeight, h=24;
 camera.left=-h*a/1.5;camera.right=h*a/1.5;camera.top=h;camera.bottom=-h;camera.updateProjectionMatrix();
});
</script>
</body>
</html>
