<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empire Builder V5.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17231b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;z-index:10;top:0;left:0;right:0;padding:8px;pointer-events:none;background:linear-gradient(#07121de8,#07121d55,transparent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:7px}
.logo{font-weight:900;font-size:18px;text-shadow:0 2px 2px #000}.logo span{color:#f0c84b}
.resources{display:flex;gap:5px;overflow:hidden;direction:rtl}
.res{min-width:68px;padding:4px 7px;border-radius:8px;background:#172b3dcc;border:1px solid #53697b;text-align:center;font-size:10px;box-shadow:0 2px 4px #0005}
.res b{display:block;color:#f5d66d;font-size:11px}
.side{position:fixed;z-index:12;left:8px;top:76px;display:flex;flex-direction:column;gap:7px}
.btn{border:2px solid #704d22;background:linear-gradient(#e8a73e,#a9601d);border-radius:11px;padding:9px 10px;color:#fff;font-weight:800;box-shadow:0 3px 0 #54351b,0 5px 8px #0006}
.small{font-size:11px;padding:7px 9px}
.bottom{position:fixed;z-index:12;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.bottom .btn{pointer-events:auto;min-width:78px}
.panel{position:fixed;z-index:20;right:10px;left:10px;bottom:72px;max-height:58%;overflow:auto;background:#0c1926f2;border:2px solid #526a78;border-radius:15px;padding:12px;display:none;box-shadow:0 10px 30px #0009}
.panel.open{display:block}.panel h2{margin:0 0 8px;font-size:18px}.close{float:left;background:#314554;border:0;border-radius:8px;color:white;padding:6px 9px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.card{background:#173047;border:1px solid #496579;border-radius:10px;padding:9px}.card h3{margin:0 0 4px;font-size:12px}.card p{margin:3px 0;color:#c5d0d5;font-size:10px}.card button{margin-top:6px;width:100%;padding:7px;border-radius:8px;border:1px solid #5d87a0;background:#285779;color:#fff}
#hint{position:fixed;z-index:11;left:50%;bottom:62px;transform:translateX(-50%);background:#091520d9;border:1px solid #587082;border-radius:10px;padding:7px 10px;font-size:10px;white-space:nowrap}
#toast{position:fixed;z-index:50;top:74px;left:50%;transform:translateX(-50%);background:#182d3deF;border:1px solid #6c8290;border-radius:10px;padding:9px 12px;font-size:11px;display:none}
#buildCursor{position:fixed;z-index:15;pointer-events:none;display:none;padding:5px 8px;border-radius:8px;background:#1e8a45dd;border:2px solid #d7ef9a;font-size:10px}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="top">
  <div class="logo">🏰 Empire Builder <span>V5.0</span></div>
  <div class="resources">
   <div class="res">💎<b id="gems">120</b></div>
   <div class="res">⛏️<b id="iron">1,700</b></div>
   <div class="res">🪵<b id="wood">3,000</b></div>
   <div class="res">🌾<b id="food">4,500</b></div>
   <div class="res">💰<b id="gold">18,000</b></div>
  </div>
 </div>
</div>

<div class="side">
 <button class="btn small" id="zoomIn">＋ 🔍</button>
 <button class="btn small" id="zoomOut">－ 🔍</button>
</div>

<div id="hint">اسحب الشاشة لتحريك الكاميرا • مرر إصبعين للتكبير • اضغط مبنى للتفاعل</div>
<div id="buildCursor">🏗️ اختر مكانًا للبناء</div>

<div class="bottom">
 <button class="btn" id="buildBtn">🏗️ بناء</button>
 <button class="btn" id="armyBtn">⚔️ الجيش</button>
 <button class="btn" id="shopBtn">🏪 المتجر</button>
 <button class="btn" id="worldBtn">🌍 العالم</button>
</div>

<div class="panel" id="panel">
 <button class="close" id="close">✕</button>
 <h2 id="panelTitle"></h2>
 <div id="panelBody"></div>
</div>
<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const state={gold:18000,food:4500,wood:3000,iron:1700,gems:120,pop:5200,level:3};
const ui=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString("ar-SA");
function render(){for(const k of ["gold","food","wood","iron","gems"])ui(k).textContent=fmt(state[k])}
function toast(t){ui("toast").textContent=t;ui("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>ui("toast").style.display="none",1500)}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78a950);
scene.fog=new THREE.Fog(0x78a950,45,95);

const camera=new THREE.OrthographicCamera(-16,16,11,-11,.1,200);
camera.position.set(0,25,22); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
ui("game").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xbfe5ff,0x45633b,1.7); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3ce,2.2); sun.position.set(-25,35,18);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);

const world=new THREE.Group();scene.add(world);
const selectable=[];
const groundMat=new THREE.MeshStandardMaterial({color:0x5b9a42,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.02})}
function box(name,x,y,z,sx,sy,sz,c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m
}
function cyl(name,x,y,z,r,h,c){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat(c));m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m
}
function tree(x,z,scale=1){
 const g=new THREE.Group();g.position.set(x,0,z);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*scale,.25*scale,.9*scale,8),mat(0x71451f));trunk.position.y=.45*scale;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.05*scale,12,10),mat(0x2f7426));crown.position.y=1.45*scale;crown.castShadow=true;g.add(crown);
 world.add(g)
}
function rock(x,z,s=1){
 const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.8*s,0),mat(0x777d76));m.position.set(x,.45*s,z);m.rotation.y=Math.random()*3;m.castShadow=true;world.add(m)
}
for(let i=-30;i<=30;i+=4){tree(i,-28,.9);tree(i,28,.9)}
for(let i=-24;i<=24;i+=4){tree(-29,i,.85);tree(29,i,.85)}
[[ -12,-12],[13,-10],[-16,8],[17,12],[-8,18],[11,19]].forEach(p=>rock(p[0],p[1],.8+Math.random()*.5));

const water=new THREE.Mesh(new THREE.PlaneGeometry(26,10),new THREE.MeshStandardMaterial({color:0x2789aa,roughness:.25,metalness:.05}));
water.rotation.x=-Math.PI/2;water.position.set(0,.025,17);water.rotation.z=-.05;water.receiveShadow=true;world.add(water);

function labelSprite(text){
 const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");
 x.fillStyle="rgba(8,18,25,.82)";x.roundRect(5,8,246,48,14);x.fill();
 x.fillStyle="white";x.font="bold 24px system-ui";x.textAlign="center";x.fillText(text,128,40);
 const tx=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));
 sp.scale.set(3.3,.82,1);sp.position.y=3.7;return sp
}

function building(type,x,z,level=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.userData={type,level};world.add(g);
 const colors={town:0xc79b49,house:0xd7c49b,farm:0x956036,barracks:0x7e4935,market:0x39779b,factory:0x596066,storage:0x6f4e35,defense:0x5b6266};
 const base=new THREE.Mesh(new THREE.BoxGeometry(type==="town"?4.4:2.8,type==="town"?3.2:2.0,type==="town"?4.4:2.8),mat(colors[type]||0xd0b98a));
 base.position.y=type==="town"?1.6:1;base.castShadow=true;base.receiveShadow=true;g.add(base);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(type==="town"?3.1:2.05,type==="town"?1.8:1.05,4),mat(type==="town"?0x9e3c32:0x8d4a35));
 roof.rotation.y=Math.PI/4;roof.position.y=type==="town"?4.05:2.55;roof.castShadow=true;g.add(roof);
 const door=new THREE.Mesh(new THREE.BoxGeometry(.48,.9,.12),mat(0x4a2c20));door.position.set(0,.48, (type==="town"?2.22:1.42)+.07);g.add(door);
 if(type==="town"){for(const sx of [-1.35,1.35]){const tower=cyl("tower",sx,2.8,1.55,.55,2.5,0xe1d0a8);g.add(tower)}}
 const name={town:"مركز الإمبراطورية",house:"مسكن",farm:"مزرعة",barracks:"ثكنة",market:"سوق",factory:"مصنع",storage:"مخزن",defense:"برج دفاعي"}[type];
 g.add(labelSprite(name));
 selectable.push(g);
 return g
}

function wall(x,z,rot=0){
 const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=rot;
 const m=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.1,.45),mat(0x9b9c92));m.castShadow=true;m.receiveShadow=true;g.add(m);world.add(g);return g
}
function wallLine(a,b,n){
 for(let i=0;i<n;i++){let t=i/(n-1);wall(THREE.MathUtils.lerp(a[0],b[0],t),THREE.MathUtils.lerp(a[1],b[1],t),Math.abs(b[0]-a[0])>Math.abs(b[1]-a[1])?0:Math.PI/2)}
}
wallLine([-11,-11],[11,-11],15);wallLine([-11,11],[11,11],15);wallLine([-11,-11],[-11,11],15);wallLine([11,-11],[11,11],15);

building("town",0,0,3);
building("farm",-6,5);building("house",6,5);building("barracks",-6,-5);building("market",6,-5);
building("factory",0,-7);building("storage",-8,0);building("defense",8,0);

const villagers=[];
function villager(x,z,phase){
 const g=new THREE.Group();const body=cyl("villager",x,.55,z,.25,.85,0xe0a15a);g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),mat(0xf0b879));head.position.y=1.05;g.add(head);
 g.userData={x,z,phase};world.add(g);villagers.push(g)
}
villager(2,3,0);villager(-2,-2,1.5);villager(4,-2,3);villager(-4,2,4.5);

let targetZoom=26;
function setZoom(z){targetZoom=THREE.MathUtils.clamp(z,17,38)}
ui("zoomIn").onclick=()=>setZoom(targetZoom-3);ui("zoomOut").onclick=()=>setZoom(targetZoom+3);

let selected=null, buildMode=false, buildType=null;
function openPanel(title,body){ui("panelTitle").textContent=title;ui("panelBody").innerHTML=body;ui("panel").classList.add("open")}
ui("close").onclick=()=>ui("panel").classList.remove("open");

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
function pick(clientX,clientY){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=((clientX-r.left)/r.width)*2-1;pointer.y=-((clientY-r.top)/r.height)*2+1;
 ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(selectable,true);
 if(!hits.length)return;
 let g=hits[0].object;while(g.parent&&g.parent!==world)g=g.parent;
 selected=g;openBuilding(g);
}
function openBuilding(g){
 const name=g.userData.type==="town"?"🏰 مركز الإمبراطورية":g.userData.type==="farm"?"🌾 المزرعة":g.userData.type==="house"?"🏠 المسكن":g.userData.type==="barracks"?"⚔️ الثكنة":g.userData.type==="market"?"🏪 السوق":g.userData.type==="factory"?"🏭 المصنع":g.userData.type==="storage"?"📦 المخزن":"🛡️ البرج الدفاعي";
 openPanel(name,`<div class="card"><h3>${name}</h3><p>المستوى: ${g.userData.level||1}</p><p>هذا مبنى حقيقي داخل عالم اللعبة، وليس بطاقة واجهة.</p><button id="upgrade">⬆️ ترقية — 💰 1,200</button></div>`);
 ui("upgrade").onclick=()=>{if(state.gold<1200)return toast("الذهب غير كافٍ");state.gold-=1200;g.userData.level++;g.scale.multiplyScalar(1.04);render();toast("تمت الترقية 🏗️")};
}

renderer.domElement.addEventListener("pointerup",e=>{if(!dragMoved)pick(e.clientX,e.clientY);dragMoved=false});
let dragMoved=false,lastX=0,lastY=0,pinchStart=0;
renderer.domElement.addEventListener("pointerdown",e=>{lastX=e.clientX;lastY=e.clientY;dragMoved=false});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.buttons){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>4)dragMoved=true;camera.position.x-=dx*.035;camera.position.z-=dy*.035;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-13,13);camera.position.z=THREE.MathUtils.clamp(camera.position.z,8,32);lastX=e.clientX;lastY=e.clientY}
});
renderer.domElement.addEventListener("wheel",e=>{e.preventDefault();setZoom(targetZoom+e.deltaY*.02)},{passive:false});

const touches=new Map();
renderer.domElement.addEventListener("touchstart",e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(e.touches.length===2)pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});
renderer.domElement.addEventListener("touchmove",e=>{
 if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchStart){setZoom(targetZoom-(d-pinchStart)*.025);pinchStart=d}e.preventDefault()}
},{passive:false});
renderer.domElement.addEventListener("touchend",e=>{for(const t of e.changedTouches)touches.delete(t.identifier)});

ui("buildBtn").onclick=()=>openPanel("🏗️ البناء",`<div class="cards">
${[["house","🏠 مسكن",800],["farm","🌾 مزرعة",700],["market","🏪 سوق",1500],["barracks","⚔️ ثكنة",2000],["factory","🏭 مصنع",2300],["defense","🛡️ برج دفاعي",1800]].map(a=>`<div class="card"><h3>${a[1]}</h3><p>💰 ${fmt(a[2])}</p><button onclick="window.startBuild('${a[0]}',${a[2]})">وضع على الأرض</button></div>`).join("")}</div>`);
window.startBuild=(type,cost)=>{if(state.gold<cost){toast("الذهب غير كافٍ");return}buildMode=true;buildType=type;ui("panel").classList.remove("open");ui("buildCursor").style.display="block";toast("اضغط على الأرض لوضع المبنى")};

renderer.domElement.addEventListener("pointerup",e=>{
 if(!buildMode||dragMoved)return;
 const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 ray.setFromCamera(pointer,camera);const hit=ray.intersectObject(ground)[0];if(hit){
   const p=hit.point; if(Math.abs(p.x)>12||Math.abs(p.z)>12)return toast("خارج منطقتك");
   const cost={house:800,farm:700,market:1500,barracks:2000,factory:2300,defense:1800}[buildType];
   state.gold-=cost;building(buildType,Math.round(p.x),Math.round(p.z));buildMode=false;buildType=null;ui("buildCursor").style.display="none";render();toast("تم وضع المبنى 🏗️");
 }
});

ui("armyBtn").onclick=()=>openPanel("⚔️ الجيش",`<div class="cards"><div class="card"><h3>🛡️ المشاة</h3><p>650 وحدة</p><button onclick="toast('تدريب 100 جندي')">تدريب</button></div><div class="card"><h3>🏹 الرماة</h3><p>180 وحدة</p><button onclick="toast('تدريب 50 رامي')">تدريب</button></div><div class="card"><h3>🐎 الفرسان</h3><p>100 وحدة</p><button onclick="toast('تدريب 20 فارس')">تدريب</button></div></div>`);
ui("shopBtn").onclick=()=>openPanel("🏪 المتجر",`<div class="cards"><div class="card"><h3>💎 جواهر</h3><p>+100 💎</p><button onclick="state.gems+=100;render();toast('تمت إضافة الجواهر')">استلام</button></div><div class="card"><h3>🌾 غذاء</h3><p>+1,000 🌾</p><button onclick="state.food+=1000;render();toast('تمت إضافة الغذاء')">شراء</button></div></div>`);
ui("worldBtn").onclick=()=>openPanel("🌍 العالم",`<div class="cards"><div class="card"><h3>🏜️ الأراضي الشمالية</h3><p>مناجم وخشب.</p><button onclick="toast('استكشاف المنطقة 🔭')">استكشاف</button></div><div class="card"><h3>🌊 الساحل</h3><p>موقع مناسب لميناء.</p><button onclick="toast('استكشاف الساحل 🔭')">استكشاف</button></div></div>`);

setInterval(()=>{state.food+=25;state.gold+=35;render()},8000);

function animate(t){
 requestAnimationFrame(animate);
 camera.zoom += (32/targetZoom-camera.zoom)*.08;camera.updateProjectionMatrix();
 villagers.forEach((v,i)=>{v.position.x=v.userData.x+Math.sin(t*.00035+v.userData.phase)*.8;v.position.z=v.userData.z+Math.cos(t*.0003+v.userData.phase)*.8});
 renderer.render(scene,camera)
}
render();animate(0);
addEventListener("resize",()=>{camera.left=-16*innerWidth/innerHeight;camera.right=16*innerWidth/innerHeight;camera.top=11;camera.bottom=-11;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
