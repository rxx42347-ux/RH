<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Empire Builder V2.0</title>
<style>
:root{
  --bg:#07111d;--panel:#0d1b2a;--panel2:#12263a;--line:#28435e;
  --text:#f4f7fb;--muted:#9db0c3;--gold:#f3c969;--green:#61d394;
  --blue:#59a8ff;--red:#ef6a6a;--land:#173b2d;--land2:#24553a;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer} .app{min-height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(180deg,#102338,#091521);border-bottom:1px solid var(--line);padding:10px 12px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand h1{font-size:20px;margin:0}.sub{font-size:11px;color:var(--muted)}
.resources{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.res{background:#102238;border:1px solid #29425c;border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}.res b{display:block;color:var(--gold);font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-height:0}.world-wrap{padding:10px;flex:1}
.world{position:relative;min-height:430px;height:calc(100vh - 260px);max-height:650px;overflow:hidden;border:2px solid #31516a;border-radius:18px;background:
radial-gradient(circle at 20% 20%,rgba(100,160,100,.18),transparent 24%),
radial-gradient(circle at 80% 70%,rgba(70,130,100,.2),transparent 28%),
linear-gradient(135deg,var(--land),#102d24 48%,#173f30);box-shadow:inset 0 0 50px rgba(0,0,0,.3)}
.world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.river{position:absolute;width:150%;height:70px;background:#1b6b88;transform:rotate(-18deg);left:-20%;top:44%;opacity:.8;border-top:2px solid #4a9db8;border-bottom:2px solid #0c526c}
.mountain{position:absolute;font-size:44px;opacity:.85;filter:drop-shadow(0 3px 2px #000);}.m1{left:7%;top:13%}.m2{left:42%;top:8%}.m3{right:7%;top:26%}.tree{position:absolute;font-size:32px;opacity:.9}.t1{left:13%;bottom:18%}.t2{left:27%;bottom:8%}.t3{right:13%;bottom:14%}.t4{right:30%;top:22%}
.base{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:74%;height:62%;border:2px dashed rgba(243,201,105,.35);border-radius:18px;background:rgba(18,55,39,.28)}
.building{position:absolute;width:62px;height:62px;border-radius:14px;background:linear-gradient(145deg,#284a68,#172d45);border:2px solid #47708e;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.35);transition:.15s;user-select:none}
.building span{font-size:27px;line-height:27px}.building small{font-size:9px;color:#d8e4ef}.building.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,201,105,.22)}
.b1{left:42%;top:36%}.b2{left:17%;top:12%}.b3{right:13%;top:17%}.b4{left:12%;bottom:12%}.b5{right:12%;bottom:12%}.b6{left:43%;bottom:8%}
.unit{position:absolute;font-size:25px;filter:drop-shadow(0 2px 2px #000);animation:float 2.4s ease-in-out infinite}.u1{left:8%;top:53%}.u2{right:8%;top:57%}.u3{right:40%;top:8%}
@keyframes float{50%{transform:translateY(-4px)}} .map-label{position:absolute;background:rgba(3,12,20,.65);padding:5px 8px;border-radius:9px;font-size:10px;color:#e9f2f8}.capital{left:43%;top:49%}
.notice{margin:8px 10px;padding:8px 10px;background:#102238;border:1px solid #29425c;border-radius:10px;font-size:12px;color:#cbd8e5}
.actions{display:flex;gap:7px;overflow:auto;padding:8px 10px 10px}.actions button{min-width:92px;padding:10px 9px;border-radius:11px;background:#17314b;border:1px solid #355572}.actions button.primary{background:#7a5c16;border-color:#d4ad4f}
.bottom{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 8px;background:#091521;border-top:1px solid var(--line);position:sticky;bottom:0;z-index:20}.bottom button{background:#11243a;border:1px solid #28445d;border-radius:10px;padding:8px 3px;font-size:11px}.bottom button.active{background:#1e3a55;border-color:#5b89ad}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:100%;max-height:82vh;overflow:auto;background:#0b1927;border-top:1px solid #38556f;border-radius:20px 20px 0 0;padding:16px}.sheet h2{margin:0 0 8px;font-size:19px}.close{float:left;background:#263b50;border-radius:9px;padding:6px 10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#12263a;border:1px solid #2d4962;border-radius:12px;padding:10px}.card h3{margin:0 0 5px;font-size:14px}.card p{margin:4px 0;color:var(--muted);font-size:11px}.card button{margin-top:6px;width:100%;padding:8px;border-radius:8px;background:#234563}.bar{height:7px;background:#08131e;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--green)}.log{font-size:12px;color:#c8d5e2;line-height:1.8}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#172b40;border:1px solid #45627b;padding:9px 14px;border-radius:11px;z-index:80;display:none;font-size:12px}
@media(min-width:760px){.app{max-width:900px;margin:auto}.world-wrap{padding:16px}.resources{gap:8px}.building{width:72px;height:72px}.building span{font-size:32px}.bottom{border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div><h1>🏰 Empire Builder <small style="color:var(--gold)">V2.0</small></h1><div class="sub">ابنِ مدينتك • طوّر جيشك • وسّع إمبراطوريتك</div></div><button id="saveBtn" title="حفظ">💾</button></div>
  <div class="resources">
    <div class="res">💰<b id="gold">12,500</b></div><div class="res">🌾<b id="food">3,200</b></div><div class="res">🪵<b id="wood">2,100</b></div><div class="res">⛏️<b id="iron">1,150</b></div><div class="res">💎<b id="gems">80</b></div>
  </div>
</header>

<main class="main">
<section class="world-wrap">
  <div class="world" id="world">
    <div class="river"></div><div class="mountain m1">⛰️</div><div class="mountain m2">🏔️</div><div class="mountain m3">⛰️</div>
    <div class="tree t1">🌲</div><div class="tree t2">🌳</div><div class="tree t3">🌲</div><div class="tree t4">🌳</div>
    <div class="base" id="base">
      <button class="building b1 selected" data-type="townhall"><span>🏰</span><small>مركز المدينة</small></button>
      <button class="building b2" data-type="farm"><span>🌾</span><small>مزرعة</small></button>
      <button class="building b3" data-type="barracks"><span>⚔️</span><small>ثكنة</small></button>
      <button class="building b4" data-type="house"><span>🏠</span><small>مساكن</small></button>
      <button class="building b5" data-type="market"><span>🏪</span><small>سوق</small></button>
      <button class="building b6" data-type="factory"><span>🏭</span><small>مصنع</small></button>
      <div class="map-label capital">العاصمة 👑</div>
    </div>
    <div class="unit u1">🛡️</div><div class="unit u2">🐎</div><div class="unit u3">🪖</div>
  </div>
  <div class="notice" id="notice">اختر مبنى على الخريطة لمعرفة وظيفته، أو اضغط «بناء» لإضافة مبنى جديد.</div>
  <div class="actions">
    <button class="primary" id="buildBtn">🏗️ بناء</button>
    <button id="armyBtn">⚔️ الجيش</button>
    <button id="worldBtn">🌍 العالم</button>
    <button id="questBtn">🎯 المهام</button>
  </div>
</section>
</main>

<nav class="bottom">
<button class="active" data-panel="city">🏰<br>مدينتي</button>
<button data-panel="economy">💰<br>الاقتصاد</button>
<button data-panel="army">🪖<br>الجيش</button>
<button data-panel="diplomacy">🤝<br>الدبلوماسية</button>
<button data-panel="research">🔬<br>التطوير</button>
</nav>
</div>

<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const state={
 gold:12500,food:3200,wood:2100,iron:1150,gems:80,
 pop:4200, happiness:76, power:340, level:3, day:1,
 buildings:{townhall:1,farm:2,barracks:1,house:4,market:1,factory:1},
 army:{infantry:420,cavalry:80,archers:120},
 research:{economy:1,military:1,agriculture:1},
 logs:["بدأت الإمبراطورية رحلة التوسع.","تم تأسيس العاصمة."]
};
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('ar-SA');
function render(){
 ["gold","food","wood","iron","gems"].forEach(k=>$(k).textContent=fmt(state[k]));
}
function toast(msg){$("toast").textContent=msg;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1700)}
function log(msg){state.logs.unshift(msg);state.logs=state.logs.slice(0,30)}
function openModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.add("open")}
$("close").onclick=()=>$("modal").classList.remove("open");
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").classList.remove("open")});

const info={
 townhall:["🏰 مركز المدينة","قلب الإمبراطورية. رفع مستواه يفتح مباني ووحدات ومناطق جديدة."],
 farm:["🌾 مزرعة","تنتج الغذاء مع مرور الوقت."], barracks:["⚔️ ثكنة","تدريب القوات البرية."],
 house:["🏠 مساكن","تزيد الحد الأقصى للسكان."],market:["🏪 سوق","يساعد على التجارة ورفع الدخل."],
 factory:["🏭 مصنع","يحوّل الموارد إلى إنتاج صناعي."]
};
document.querySelectorAll(".building").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".building").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
 const d=info[b.dataset.type];$("notice").textContent=d[0]+" — "+d[1];
}));

$("buildBtn").onclick=()=>{
 openModal("🏗️ بناء مبنى",`<div class="cards">
 ${["farm|🌾|مزرعة|400|250","house|🏠|مساكن|500|350","market|🏪|سوق|900|500","factory|🏭|مصنع|1400|700","barracks|⚔️|ثكنة|1100|600"].map(s=>{
  let [id,ic,n,c,w]=s.split("|");return `<div class="card"><h3>${ic} ${n}</h3><p>تكلفة: 💰${fmt(c)} + 🪵${fmt(w)}</p><button data-build="${id}" data-gold="${c}" data-wood="${w}">بناء</button></div>`
 }).join("")}</div>`);
 document.querySelectorAll("[data-build]").forEach(btn=>btn.onclick=()=>{
  const c=+btn.dataset.gold,w=+btn.dataset.wood;
  if(state.gold<c||state.wood<w){toast("الموارد غير كافية");return}
  state.gold-=c;state.wood-=w;state.buildings[btn.dataset.build]=(state.buildings[btn.dataset.build]||0)+1;
  log("تم بناء "+info[btn.dataset.build][0]);render();toast("تم البناء بنجاح 🏗️");
 });
};
$("armyBtn").onclick=()=>openModal("🪖 الجيش",`
<div class="cards">
<div class="card"><h3>🛡️ المشاة</h3><p>العدد: ${fmt(state.army.infantry)}</p><button data-train="infantry">تدريب 50 — 💰250 🌾100</button></div>
<div class="card"><h3>🐎 الفرسان</h3><p>العدد: ${fmt(state.army.cavalry)}</p><button data-train="cavalry">تدريب 10 — 💰400 🌾120</button></div>
<div class="card"><h3>🏹 الرماة</h3><p>العدد: ${fmt(state.army.archers)}</p><button data-train="archers">تدريب 25 — 💰220 🌾80</button></div>
<div class="card"><h3>⚔️ القوة</h3><div class="bar"><i style="width:${Math.min(100,state.power/10)}%"></i></div><p>${fmt(state.power)} نقطة قوة</p></div>
</div>`);
document.querySelectorAll("[data-train]").forEach(btn=>btn.onclick=()=>{
 const type=btn.dataset.train,cost=type==="cavalry"?400:250,food=type==="cavalry"?120: type==="archers"?80:100,n=type==="cavalry"?10:type==="archers"?25:50;
 if(state.gold<cost||state.food<food){toast("الغذاء أو الذهب غير كافٍ");return}
 state.gold-=cost;state.food-=food;state.army[type]+=n;state.power+=Math.ceil(n*(type==="cavalry"?1.8:1));render();toast("تم تدريب القوات 🪖");
});
$("worldBtn").onclick=()=>openModal("🌍 العالم",`
<div class="card"><h3>🗺️ خريطة العالم</h3><p>مناطق مجاورة قابلة للاستكشاف والتجارة والتوسع.</p></div>
<div class="cards">
<div class="card"><h3>🏜️ الشمال</h3><p>علاقة: 58/100</p><button onclick="toast('أرسلت بعثة استطلاع 🔭')">استكشاف</button></div>
<div class="card"><h3>🌊 الساحل</h3><p>علاقة: 72/100</p><button onclick="toast('تم فتح طريق تجاري 🚢')">تجارة</button></div>
<div class="card"><h3>⛰️ الشرق</h3><p>مناجم غنية بالحديد.</p><button onclick="toast('المنطقة تحتاج قوة عسكرية أكبر')">استطلاع</button></div>
<div class="card"><h3>🏝️ الجزر</h3><p>منطقة بعيدة لم تُكتشف بعد.</p><button onclick="toast('تحتاج إلى ميناء متطور')">استكشاف</button></div>
</div>`);
$("questBtn").onclick=()=>openModal("🎯 المهام",`
<div class="cards">
<div class="card"><h3>🏗️ بداية التوسع</h3><p>ابنِ 3 مبانٍ جديدة.</p><button onclick="toast('المهمة قيد التقدم')">متابعة</button></div>
<div class="card"><h3>🪖 جيش المملكة</h3><p>ارفع القوة إلى 500.</p><button onclick="toast('المكافأة: 💰1000')">استلام</button></div>
<div class="card"><h3>🌾 الأمن الغذائي</h3><p>امتلك 3 مزارع.</p><button onclick="toast('المهمة قيد التقدم')">متابعة</button></div>
</div>`);

function panel(type){
 if(type==="city") openModal("🏰 مدينتي",`<div class="card"><h3>العاصمة — المستوى ${state.level}</h3><p>👥 السكان ${fmt(state.pop)} • 😊 السعادة ${state.happiness}%</p><p>🏠 المساكن: ${state.buildings.house} • 🌾 المزارع: ${state.buildings.farm}</p></div><div class="card"><h3>📜 السجل</h3><div class="log">${state.logs.slice(0,8).map(x=>"• "+x).join("<br>")}</div></div>`);
 if(type==="economy") openModal("💰 الاقتصاد",`<div class="cards"><div class="card"><h3>الدخل</h3><p>+💰 ${fmt(850)} / يوم</p></div><div class="card"><h3>الإنتاج</h3><p>🌾 +320 • 🪵 +180 • ⛏️ +90</p></div><div class="card"><h3>الضرائب</h3><p>المعدل الحالي: 10%</p><button onclick="state.happiness=Math.max(0,state.happiness-2);toast('تم رفع الضرائب');">رفع الضرائب</button></div></div>`);
 if(type==="army") $("armyBtn").click();
 if(type==="diplomacy") openModal("🤝 الدبلوماسية",`<div class="cards"><div class="card"><h3>🏳️ الشمال</h3><p>العلاقة: 58/100</p><button onclick="toast('تم إرسال عرض سلام')">عرض سلام</button></div><div class="card"><h3>🌊 الساحل</h3><p>العلاقة: 72/100</p><button onclick="toast('تم اقتراح اتفاق تجاري')">اتفاق تجاري</button></div></div>`);
 if(type==="research") openModal("🔬 التطوير",`<div class="cards">
 ${Object.entries(state.research).map(([k,v])=>`<div class="card"><h3>${k==="economy"?"💰 الاقتصاد":k==="military"?"⚔️ العسكرية":"🌾 الزراعة"}</h3><p>المستوى ${v}</p><button data-tech="${k}">تطوير — 💎20</button></div>`).join("")}</div>`);
 document.querySelectorAll("[data-tech]").forEach(b=>b.onclick=()=>{if(state.gems<20){toast("الجواهر غير كافية");return}state.gems-=20;state.research[b.dataset.tech]++;render();toast("تم تطوير التقنية 🔬")});
}
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");panel(b.dataset.panel)});
$("saveBtn").onclick=()=>{try{localStorage.setItem("empireV2",JSON.stringify(state));toast("تم حفظ الإمبراطورية 💾")}catch(e){toast("تعذر الحفظ")}};
try{const s=JSON.parse(localStorage.getItem("empireV2"));if(s&&s.gold!=null)Object.assign(state,s)}catch(e){}
render();
setInterval(()=>{state.day++;state.food+=Math.max(10,state.buildings.farm*35);state.wood+=state.buildings.factory*12;state.gold+=state.buildings.market*55;state.pop+=state.buildings.house*3;render()},7000);
</script>
</body>
</html>
