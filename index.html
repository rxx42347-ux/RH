<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire Builder</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#111827;color:#f9fafb}
header{padding:18px;background:#1f2937;text-align:center}
main{padding:16px;max-width:900px;margin:auto}
.card{background:#1f2937;border-radius:14px;padding:16px;margin:12px 0}
button{padding:10px 14px;margin:4px;border:0;border-radius:10px;cursor:pointer}
.stat{display:inline-block;background:#374151;padding:8px 12px;border-radius:10px;margin:4px}
</style>
</head>
<body>
<header><h1>🏰 Empire Builder</h1><div>نسخة Android-ready V0.3</div></header>
<main>
<div class="card">
<h2>مملكتك</h2>
<div id="stats"></div>
</div>
<div class="card">
<h2>البناء</h2>
<button onclick="build('farm')">🌾 مزرعة</button>
<button onclick="build('house')">🏠 مساكن</button>
<button onclick="build('road')">🛣️ طريق</button>
<button onclick="build('market')">🏪 سوق</button>
<button onclick="build('power')">⚡ محطة طاقة</button>
<button onclick="build('factory')">🏭 مصنع</button>
</div>
<div class="card">
<h2>الاقتصاد</h2>
<button onclick="tax()">💰 تحصيل الضرائب</button>
<button onclick="invest()">📈 استثمار</button>
<button onclick="trade()">🤝 تجارة</button>
</div>
<div class="card">
<h2>الجيش والدبلوماسية</h2>
<button onclick="train()">🪖 تدريب الجيش</button>
<button onclick="diplomacy()">🤝 دبلوماسية</button>
</div>
<div class="card">
<h2>الزمن</h2>
<button onclick="nextMonth()">⏭️ الشهر التالي</button>
<button onclick="save()">💾 حفظ</button>
<button onclick="load()">📂 تحميل</button>
<button onclick="resetGame()">🔄 إعادة</button>
</div>
<div class="card"><h2>السجل</h2><div id="log"></div></div>
</main>
<script>
let s=JSON.parse(localStorage.getItem('empireV03'))||{
money:100000,pop:1000,happy:70,food:500,iron:200,wood:300,energy:100,
jobs:600,houses:300,army:100,reputation:50,month:1,
buildings:{farm:0,house:0,road:0,market:0,power:0,factory:0}
};
function render(){
stats.innerHTML=Object.entries({
'💰 المال':s.money,'👥 السكان':s.pop,'😊 السعادة':s.happy+'%',
'🌾 الغذاء':s.food,'⛓️ الحديد':s.iron,'🪵 الخشب':s.wood,
'⚡ الطاقة':s.energy,'💼 الوظائف':s.jobs,'🏠 المساكن':s.houses,
'🪖 الجيش':s.army,'⭐ السمعة':s.reputation,'📅 الشهر':s.month
}).map(([k,v])=>`<span class="stat"><b>${k}</b>: ${v}</span>`).join('');
}
function logMsg(x){log.innerHTML='<div>'+x+'</div>'+log.innerHTML}
function build(t){
let costs={farm:[3000,0,30],house:[4000,0,40],road:[2000,0,20],market:[7000,20,20],power:[10000,30,30],factory:[15000,60,50]};
let [m,i,w]=costs[t]; if(s.money<m||s.iron<i||s.wood<w)return logMsg('❌ الموارد غير كافية');
s.money-=m;s.iron-=i;s.wood-=w;s.buildings[t]++;
if(t==='farm')s.food+=150;
if(t==='house')s.houses+=100;
if(t==='road')s.jobs+=30;
if(t==='market')s.reputation+=2;
if(t==='power')s.energy+=50;
if(t==='factory')s.jobs+=100;
logMsg('✅ تم بناء '+t);render();
}
function tax(){let x=Math.floor(s.pop*8);s.money+=x;s.happy=Math.max(0,s.happy-2);logMsg('💰 تم تحصيل '+x+' من الضرائب');render()}
function invest(){if(s.money<5000)return logMsg('❌ المال غير كاف');s.money-=5000;s.jobs+=60;s.reputation+=1;logMsg('📈 تم الاستثمار في الاقتصاد');render()}
function trade(){if(s.money<3000)return logMsg('❌ المال غير كاف');s.money-=3000;s.food+=250;s.iron+=20;logMsg('🤝 تمت صفقة تجارية');render()}
function train(){if(s.money<4000||s.iron<10)return logMsg('❌ الموارد غير كافية');s.money-=4000;s.iron-=10;s.army+=20;logMsg('🪖 تم تدريب وحدات جديدة');render()}
function diplomacy(){s.reputation+=5;s.money-=1000;logMsg('🤝 تحسنت العلاقات الدبلوماسية');render()}
function nextMonth(){
s.month++;s.money+=Math.floor(s.pop*5);s.food-=Math.floor(s.pop*.2);
s.pop+=Math.max(0,Math.floor(s.jobs/100));s.happy=Math.max(0,Math.min(100,s.happy+(s.food>0?1:-8)));
if(s.food<0){s.food=0;s.happy=Math.max(0,s.happy-10)}
logMsg('📅 بدأ شهر جديد');render();save()
}
function save(){localStorage.setItem('empireV03',JSON.stringify(s));logMsg('💾 تم الحفظ')}
function load(){s=JSON.parse(localStorage.getItem('empireV03'))||s;render();logMsg('📂 تم التحميل')}
function resetGame(){if(confirm('إعادة اللعبة؟')){localStorage.removeItem('empireV03');location.reload()}}
render();
</script>
</body></html>
